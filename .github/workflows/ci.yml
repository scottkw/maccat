name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest

    strategy:
      matrix:
        pythonhashseed: [0, 42, "random"]

    env:
      PYTHONHASHSEED: ${{ matrix.pythonhashseed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m venv venv && ./venv/bin/pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ./venv/bin/ruff check src tests

      - name: Type check (mypy)
        run: PYTHONPATH=src ./venv/bin/mypy --strict src/maccat

      - name: Run tests
        run: PYTHONPATH=src ./venv/bin/pytest -x -q

  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build maccat.pyz (CI-02)
        run: chmod +x scripts/build-pyz.sh && ./scripts/build-pyz.sh

      - name: Upload maccat.pyz artifact
        uses: actions/upload-artifact@v4
        with:
          name: maccat.pyz
          path: dist/maccat.pyz
          if-no-files-found: error
